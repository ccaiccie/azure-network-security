#cloud-config
# Two tiny web listeners with the Python that ships in the image: no package download.
#   port 80   : answers with the VM name, the local address the request arrived on, and the client address
#   port 8080 : /health returns 200 (HTTP probe target) and the same page elsewhere
# With floating IP on, loopback_ip is the frontend address and is added to lo so the guest accepts it.
write_files:
  - path: /opt/web.py
    permissions: "0755"
    content: |
      import http.server, socket, socketserver, sys
      port = int(sys.argv[1])
      class H(http.server.BaseHTTPRequestHandler):
          protocol_version = "HTTP/1.1"
          def do_GET(self):
              if self.path == "/health":
                  body = b"ok\n"
              else:
                  body = ("%s served %s:%d to client %s\n" % (socket.gethostname(),
                          self.connection.getsockname()[0], port, self.client_address[0])).encode()
              self.send_response(200)
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)
          def log_message(self, *a):
              pass
      class S(socketserver.ThreadingMixIn, http.server.HTTPServer):
          daemon_threads = True
          allow_reuse_address = True
      S(("0.0.0.0", port), H).serve_forever()
  - path: /etc/systemd/system/web@.service
    content: |
      [Unit]
      Description=lab web listener on port %i
      After=network.target
      [Service]
      ExecStart=/usr/bin/python3 /opt/web.py %i
      Restart=always
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, "web@80.service" ]
  - [ systemctl, enable, --now, "web@8080.service" ]
%{ if loopback_ip != "" ~}
  - [ ip, addr, add, "${loopback_ip}/32", dev, lo ]
%{ endif ~}
