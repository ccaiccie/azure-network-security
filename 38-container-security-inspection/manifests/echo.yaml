# Designed, not tested. Namespace, a client pod and an echo app (prints the caller address and headers).
apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: lab
  labels:
    app: client
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sleep", "86400"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/echoserver:1.10
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: lab
spec:
  type: ClusterIP
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 8080
