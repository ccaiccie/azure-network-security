# Optional: Cilium name-based egress. Needs the Cilium dataplane and the ACNS feature set (check current Microsoft docs).
# Designed, not tested.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-saas
  namespace: shop
spec:
  endpointSelector:
    matchLabels: {app: web}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: ANY}
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: example.com
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
