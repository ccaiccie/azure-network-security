# Cluster B: namespace orders, an echo app and an internal LoadBalancer Service at 10.72.0.100.
# Designed, not tested. The echo image tag is an example: pin and check a tag you trust.
apiVersion: v1
kind: Namespace
metadata:
  name: orders
  labels:
    kubernetes.io/metadata.name: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders, tier: api}
    spec:
      containers:
        - name: echo
          image: ealen/echo-server:latest
          ports:
            - containerPort: 80
          env:
            - {name: PORT, value: "8080"}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: orders
  labels: {app: orders}
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.72.0.100
  externalTrafficPolicy: Cluster
  selector: {app: orders}
  ports:
    - port: 8080
      targetPort: 8080
