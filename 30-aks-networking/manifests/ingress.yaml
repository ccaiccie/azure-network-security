# Needs gate 3 (application routing add-on). The class name comes from the add-on; check current docs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-clusterip
                port:
                  number: 80
