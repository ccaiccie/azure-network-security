#cloud-config
# Designed, not tested. Starts a tiny listener on tcp/8080 that answers with the caller address it saw.
write_files:
  - path: /opt/listener.py
    permissions: "0755"
    content: |
      from http.server import BaseHTTPRequestHandler, HTTPServer

      class H(BaseHTTPRequestHandler):
          def do_GET(self):
              body = ("caller=%s\n" % self.client_address[0]).encode()
              self.send_response(200)
              self.send_header("Content-Type", "text/plain")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

      HTTPServer(("0.0.0.0", 8080), H).serve_forever()
  - path: /etc/systemd/system/listener.service
    content: |
      [Unit]
      Description=Caller address listener
      After=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/listener.py
      Restart=always

      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now listener.service
